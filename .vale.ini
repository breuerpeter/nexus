StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Names
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/redhat-documentation/vale-at-red-hat/releases/download/v677/RedHat.zip, \
  https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip

# Markdown, and the comments and docstrings of Python, where Vale skips the code. Vale reads YAML,
# TOML, shell, and ini as plain text, keys and commands included, and the JavaScript and CSS under
# docs/ are mostly vendored libraries, so those stay out.
[*.{md,py}]
# Project holds this repo's own rules, tracked in .vale/styles/Project/: how prose writes the name.
BasedOnStyles = Google, Project
# mkdocstrings directive lines (`::: nexus_sim.Sim`) and mkdocs-material icon shortcodes
# (`:octicons-arrow-right-24:`) are markup, not prose.
TokenIgnores = (?m)^::: .+, (:[a-z][a-z0-9_-]*:)
# Red Hat bans the em dash outright; Google only bans the spaces around it.
Google.EmDash = NO
RedHat.EmDash = YES
RedHat.SentenceLength = YES
RedHat.RepeatedWords = YES
RedHat.Conjunctions = YES
RedHat.Slash = YES
RedHat.SmartQuotes = YES
RedHat.PascalCamelCase = YES
RedHat.SimpleWords = YES
RedHat.TermsWarnings = YES
RedHat.Spelling = YES
write-good.Weasel = YES
write-good.TooWordy = YES
proselint.Cliches = YES

# Vale reads Python comments and docstrings as plain text, so a tensor shape, a call signature, a
# dotted name such as ``nexus_sim.Sim``, an ellipsis in a signature, or a quoted code literal trips a
# rule meant for prose, and neither a code span nor an inline comment can exempt it.
[*.py]
Google.Parens = NO
Google.Spacing = NO
Google.Ellipses = NO
Google.Quotes = NO

# Per-file exemptions, one each, for an identifier that is the documentation.
# The `spawn` vehicle-config key; the `--recenter spawn` CLI value; the Isaac Lab attribute path
# `env_cfg.robot.spawn.usd_path`.
[nexus_sim/_src/physics/physics.py]
RedHat.TermsWarnings = NO
[scripts/assets/obj_to_usd.py]
RedHat.TermsWarnings = NO
[nexus-rl/src/nexus_rl/tasks/direct/goto/config/astro_max.py]
RedHat.TermsWarnings = NO
# The catalog schema's `url` field.
[nexus_sim/_src/{assets,config}/*.py]
Google.WordList = NO
# `validate` is pydantic's term and a Catalog method.
[nexus_sim/_src/config/{models,catalog}.py]
write-good.TooWordy = NO
# `RecordChannel.latest` is a method name.
[nexus_sim/_src/api/sim.py]
Google.Timeless = NO
[nexus_sim/_src/recording/recorder.py]
Google.Timeless = NO
# The usage line names the OUT environment variable.
[scripts/assets/convert_urdf.py]
Google.Acronyms = NO
# Cloud is the name of a subsystem plane.
[docs/design/real-vs-sim.md]
Google.WordList = NO
