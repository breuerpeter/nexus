# Newton sim stack: the ground services a decoupled PX4 flight uses BESIDES the sim and PX4. They
# share host networking so PX4 SITL dials into the simulator's HIL server on the host's :4560 (and the
# GCS MAVLink on :18570) exactly as in a real decoupled flight — the simulator runs on the host:
# `uv run nexus run …`.
#
# PX4 SITL and the Kit render peer are NOT services here. The sim starts and stops both itself,
# through the docker SDK: PX4's container is defined once in nexus/_src/vehicle/controllers/px4/sitl.py
# and the Kit peer's in nexus/_src/rendering/peer.py. A second copy of a peer's definition in this
# file drifted from the one the sim runs for months before anyone noticed.
# docker/README.md says where the images come from.
services:
  # Companion mavlink-router stand-in (laptop-only fallback): serve the GCS a MAVLink TCP
  # endpoint on :5790, routed to PX4 SITL's UDP GCS link (:18570). The representative demo now
  # runs the REAL mavlink-router on the emulated companion computer instead, so this
  # service is gated behind the `laptop-only` compose profile and is NOT started by a default
  # `up`. Restore the no-emulator path with `--profile laptop-only up mavp2p`. Host net so :5790 is
  # reachable over WLAN.
  #
  # Two non-default flags are LOAD-BEARING (found 2026-07-04 debugging the A2 bench — without
  # them the GCS gets only heartbeats, never ATTITUDE/telemetry):
  #   --read-timeout=1h : mavp2p's default 10s read-timeout tears down + re-opens the udpc
  #     channel to PX4 whenever PX4 is briefly silent, which changes mavp2p's ephemeral source
  #     port. PX4's :18570 GCS instance latches telemetry onto the FIRST source port it hears
  #     from, so the port change strands the stream (only broadcast HEARTBEAT still arrives).
  #     A long read-timeout keeps the port stable so PX4's latch holds.
  #   --hb-disable : mavp2p injects its own heartbeat as sys=125 by default, which the GCS
  #     renders as a spurious second "vehicle". Disable it so the GCS sees only PX4 (sys 1).
  # Also bring mavp2p up AFTER PX4 is streaming — it can't latch a vehicle that isn't there yet.
  mavp2p:
    image: bluenviron/mavp2p:latest
    profiles: ["laptop-only"]
    network_mode: host
    restart: unless-stopped
    command: ["--read-timeout=1h", "--hb-disable", "tcps:0.0.0.0:5790", "udpc:127.0.0.1:18570"]

  # WebRTC/WHEP video gateway the GCS frontend consumes (the companion's mediamtx stand-in).
  # Fed by an RTSP publisher on cam1 (test pattern now; Isaac chase-cam in Plan 3).
  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
