name: lint

# Static checks — ruff (lint + format), typos, the freshness of both uv locks (the pre-commit
# hooks), and the import-linter architecture contract. Free + fast; runs on every PR with no path
# filter (so it's a clean required merge gate). No GPU.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # pre-commit.ci skips uv-lock (no network there); GitHub Actions has network, so this also
      # doubles as the freshness check for uv.lock and nexus-rl/uv.lock.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      - run: uv run --locked lint-imports
