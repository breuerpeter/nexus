name: gpu-examples

# ALL examples on the GPU runner — the flight-performance + speed regression gate.
# scripts/ci/evaluate_examples.py runs each one, scores it (evo pose APE + the example's own stats
# + the steady RTF), and gates against scripts/ci/examples_baselines.json. One box per example,
# through a matrix over gpu-runner.yml: a measured flight cannot share a GPU, and two on one box
# collide on PX4's fixed ports, so the leg takes the slowest example plus one boot, and any red
# example reds the required context. Each box provisions what its example needs, in-command: the
# PX4 checkout via scripts/ci/provision_px4.sh (cached per pin) for px4_sitl on the tracked pin
# (scripts/ci/px4.ref, tokenless clone), acados via scripts/setup_acados.sh (cached) for
# acados_nmpc — no --skip-missing, so a broken provision fails loudly. The PX4 build is
# evaluate_examples.py's own, made before the example (warm from the cache). The merge job joins
# the boxes' parts into the one examples-eval artifact. With --upload each box refreshes its
# example's docs .rrd embed + the bench trend feed (main / dispatch only); on main pushes a
# data-refresh PR updates docs/data/examples_bench.json.
# goto_policy flies the hosted policy here: given a policy the flight is bit-reproducible, so it is
# the exact deploy gate, on the leg that already runs for the deploy-side paths. The rl leg's fresh
# export flies as goto_policy_fresh on gpu-rl. Advisory; a labeled fork PR flies through
# pull_request_target on per-run approval (gpu-runner.yml).

on:
  push:
    branches: [main]
    paths:
      - "nexus/examples/**"
      - "nexus/_src/**"
      - "scripts/ci/evaluate_examples.py"
      - "scripts/ci/examples_baselines.json"
      - "scripts/ci/provision_px4.sh"
      - "scripts/ci/px4.ref"
      - "docker/px4-sitl/**"
  # Offered on EVERY PR; runs only once the `gpu` label is applied — the label IS the
  # GPU-spend approval (environment required-reviewers need an Enterprise plan here).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The fork path: fires for every PR; gpu-runner.yml narrows it to labeled fork PRs with a
  # per-run approval and checks out the approved head sha, never the base.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the recordings + benchmark data to the CI artifacts bucket"
        type: boolean
        default: false
      update-baselines:
        description: "Re-record baseline values on the runner (updated file rides the artifact)"
        type: boolean
        default: false

permissions:
  id-token: write # OIDC — gpu-runner assumes the AWS role to start/stop the box
  contents: read
  packages: read # GHCR pull of the px4-sitl toolchain image

concurrency:
  # One group per PR per event: the two events of one PR must not cancel each other, and on
  # pull_request_target github.ref is the base branch, which would pool every fork PR with main.
  group: gpu-examples-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The GPU-spend gate lives in gpu-runner.yml, once, on the job that starts the instance.
  # An entry names the setup its example needs on a fresh box and the caches gpu-runner restores
  # for it; fail-fast is off so one red example never cancels the others' evidence. The name keeps
  # the setup command out of the check names.
  gpu:
    name: ${{ matrix.example }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: pid }
          - { example: gain_tuning }
          - { example: mass_recovery }
          - { example: sampling_mpc }
          - { example: goto_policy }
          - example: acados_nmpc
            caches: acados
            setup: >-
              (command -v cmake >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq cmake)) &&
              bash scripts/setup_acados.sh
          - example: px4_sitl
            caches: px4
            setup: bash scripts/ci/provision_px4.sh
    uses: ./.github/workflows/gpu-runner.yml
    with:
      cache-scope: ${{ matrix.example }}
      caches: ${{ matrix.caches || '' }}
      command: >-
        ${{ matrix.setup || 'true' }} &&
        uv run --group ci --extra examples python scripts/ci/evaluate_examples.py
        --only ${{ matrix.example }}
        ${{ inputs.update-baselines && '--update-baselines' || '' }}
        ${{ (github.event_name == 'push' || inputs.upload) && '--upload' || '' }}
      artifact-name: examples-eval-${{ matrix.example }}
      artifact-path: .eval-artifacts
    secrets: inherit

  # The parts, one per example, join into the one examples-eval artifact a reader and the
  # data-refresh PR expect: every recording and score file, one benchmark.json, one
  # examples_bench.json and, on update-baselines, one examples_baselines.json. No GPU.
  merge:
    needs: gpu
    if: ${{ !cancelled() && needs.gpu.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          pattern: examples-eval-*
          path: .eval-parts
      - run: python3 scripts/ci/merge_eval_parts.py .eval-parts .eval-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: examples-eval
          path: .eval-artifacts
          include-hidden-files: true

  # The branch-protection context. A job that calls a reusable workflow reports its checks as
  # "<job> / <inner job>", never under its own name, so the protected name has to come from a
  # job this workflow owns.
  examples:
    needs: gpu
    # Skip when the leg skipped, so this reports `skipped` — which satisfies the required context
    # without claiming the GPU work passed, and keeps it out of the successful list. `always()` with
    # the explicit != 'skipped' is load-bearing: a bare `needs:` would ALSO skip on failure, and a
    # skipped required check counts as satisfied, so a red leg would stop blocking the merge.
    if: ${{ always() && needs.gpu.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the GPU leg's result
        run: |
          echo "GPU leg: ${{ needs.gpu.result }}"
          [ "${{ needs.gpu.result }}" = "success" ] || exit 1

  data-refresh:
    # The result check is explicit: merge skips when an example is red, and the implicit success()
    # would skip this job for it without a word.
    if: ${{ !cancelled() && needs.merge.result == 'success' && github.event_name == 'push' }}
    needs: merge
    uses: ./.github/workflows/data-refresh.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      artifact-name: examples-eval
      src: examples_bench.json
      dest: docs/data/examples_bench.json
    secrets: inherit
