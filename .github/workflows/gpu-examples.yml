name: gpu-examples

# ALL examples on the GPU runner — the flight-performance + speed regression gate.
# scripts/ci/evaluate_examples.py runs each one, scores it (evo pose APE + the example's own stats
# + the steady RTF), and gates against scripts/ci/examples_baselines.json. The event picks the shape.
# A pull request flies every example at once on one box, `shared`, gated on the correctness rows
# alone: sharing the box's vCPUs lowers each flight's RTF, so its rtf rows are skipped. A push or a dispatch flies one box per example, `gpu`,
# through a matrix over gpu-runner.yml, with the rtf gates: a measured flight cannot share a GPU,
# so a speed regression is caught on the merge commit. Each box provisions what its examples need,
# in-command: acados via the example's --provision (cached) — no --skip-missing, so a broken
# provision fails loudly. PX4 provisions by no hand: evaluate_examples.py fetches the PX4 tree the
# controller pins and builds it before the examples fly, the way a user's first run does, and the
# box caches that tree and the px4-sitl image under the pin (scripts/ci/px4_image_cache.sh saves
# and loads the image). One PX4 flight per box: two collide on PX4's fixed ports. The merge job
# joins the score files of the fan-out's parts into the one examples-eval artifact. On every event
# only a red flight's .rrd rides an artifact, in its own part. With --upload each box refreshes
# its example's docs .rrd embed + the bench trend feed (main / dispatch only). A red flight leaves
# its embed as published and still feeds the trend. On main pushes a data-refresh PR updates
# docs/data/examples_bench.json.
# goto_policy flies the hosted policy here: given a policy the flight is bit-reproducible, so it is
# the exact deploy gate, on the leg that already runs for the deploy-side paths. The rl leg's fresh
# export flies as goto_policy_fresh on gpu-rl. Advisory; a labeled fork PR flies through
# pull_request_target on per-run approval (gpu-runner.yml).

on:
  push:
    branches: [main]
    paths:
      - "nexus_sim/examples/**"
      - "nexus_sim/_src/**"
      - "scripts/ci/evaluate_examples.py"
      - "scripts/ci/examples_baselines.json"
      - "scripts/ci/px4_image_cache.sh"
  # Offered on EVERY PR; runs only once the `gpu` label is applied — the label IS the
  # GPU-spend approval (environment required-reviewers need an Enterprise plan here).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The fork path: fires for every PR; gpu-runner.yml narrows it to labeled fork PRs with a
  # per-run approval and checks out the approved head sha, never the base.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the recordings + benchmark data to the CI artifacts bucket"
        type: boolean
        default: false
      update-baselines:
        description: "Re-record baseline values on the runner (updated file rides the artifact)"
        type: boolean
        default: false

permissions:
  id-token: write # OIDC — gpu-runner assumes the AWS role to start/stop the box
  contents: read

concurrency:
  # One group per PR per event: the two events of one PR must not cancel each other, and on
  # pull_request_target github.ref is the base branch, which would pool every fork PR with main.
  group: gpu-examples-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The GPU-spend gate lives in gpu-runner.yml, once, on the job that starts the instance.
  # An entry names the setup its example needs on a fresh box and the cache entry gpu-runner
  # restores for it; fail-fast is off so one red example never cancels the others' evidence. The
  # name keeps the setup command out of the check names.
  gpu:
    if: ${{ !startsWith(github.event_name, 'pull_request') }}
    name: ${{ matrix.example }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: pid }
          - { example: gain_tuning }
          - { example: mass_recovery }
          - { example: sampling_mpc }
          - { example: goto_policy }
          - example: acados_nmpc
            cache-path: ~/.cache/nexus/acados
            cache-name: acados
            cache-files: |
              nexus_sim/examples/controllers/acados_nmpc/acados.ref
              nexus_sim/examples/controllers/acados_nmpc/provision.py
            setup: >-
              (command -v cmake >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq cmake)) &&
              uv run --locked --extra acados -m nexus_sim.examples acados_nmpc --provision
          - example: px4_sitl
            cache-path: |
              ~/.cache/nexus/px4
              ~/.cache/nexus/ci/px4-sitl.tar
            cache-name: px4
            cache-files: |
              nexus_sim/_src/peers/px4_sitl/px4.ref
              nexus_sim/_src/peers/px4_sitl/checkout.py
              nexus_sim/_src/peers/px4_sitl/image/Dockerfile
            setup: bash scripts/ci/px4_image_cache.sh load
            teardown: bash scripts/ci/px4_image_cache.sh save
    uses: ./.github/workflows/gpu-runner.yml
    with:
      cache-scope: ${{ matrix.example }}
      cache-path: ${{ matrix.cache-path || '' }}
      cache-name: ${{ matrix.cache-name || '' }}
      cache-files: ${{ matrix.cache-files || '' }}
      command: >-
        ${{ matrix.setup || 'true' }} &&
        uv run --locked --group ci --extra examples python scripts/ci/evaluate_examples.py
        --only ${{ matrix.example }}
        ${{ inputs.update-baselines && '--update-baselines' || '' }}
        ${{ (github.event_name == 'push' || inputs.upload) && '--upload' || '' }} &&
        ${{ matrix.teardown || 'true' }}
      artifact-name: examples-eval-${{ matrix.example }}
      artifact-path: .eval-artifacts
    secrets: inherit

  # A pull request's one box: PX4 and acados provision in parallel, every extra syncs once, and the
  # harness flies the examples at once, so the box needs no join and uploads examples-eval itself.
  shared:
    if: ${{ startsWith(github.event_name, 'pull_request') }}
    uses: ./.github/workflows/gpu-runner.yml
    with:
      cache-scope: shared
      # The box's one cache entry holds the PX4 tree and image and the acados build together.
      cache-path: |
        ~/.cache/nexus/px4
        ~/.cache/nexus/ci/px4-sitl.tar
        ~/.cache/nexus/acados
      cache-name: px4-acados
      cache-files: |
        nexus_sim/_src/peers/px4_sitl/px4.ref
        nexus_sim/_src/peers/px4_sitl/checkout.py
        nexus_sim/_src/peers/px4_sitl/image/Dockerfile
        nexus_sim/examples/controllers/acados_nmpc/acados.ref
        nexus_sim/examples/controllers/acados_nmpc/provision.py
      command: >-
        (command -v cmake >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq cmake)) &&
        bash scripts/ci/px4_image_cache.sh load &&
        uv sync --locked --group ci --extra examples --extra acados --extra policy &&
        uv run --no-sync -m nexus_sim.examples acados_nmpc --provision &&
        uv run --no-sync python scripts/ci/evaluate_examples.py --shared &&
        bash scripts/ci/px4_image_cache.sh save
      artifact-name: examples-eval
      artifact-path: .eval-artifacts
    secrets: inherit

  # The parts, one per example, join into the one examples-eval artifact a reader and the
  # data-refresh PR expect: every recording and score file, one benchmark.json, one
  # examples_bench.json and, on update-baselines, one examples_baselines.json. No GPU.
  merge:
    needs: gpu
    if: ${{ !cancelled() && needs.gpu.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          pattern: examples-eval-*
          path: .eval-parts
      - run: python3 scripts/ci/merge_eval_parts.py .eval-parts .eval-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: examples-eval
          path: .eval-artifacts
          include-hidden-files: true
          retention-days: 14

  # The branch-protection context. A job that calls a reusable workflow reports its checks as
  # "<job> / <inner job>", never under its own name, so the protected name has to come from a
  # job this workflow owns.
  examples:
    needs: [gpu, shared]
    # Skip when the leg skipped, so this reports `skipped` — which satisfies the required context
    # without claiming the GPU work passed, and keeps it out of the successful list. `always()` with
    # the explicit != 'skipped' is load-bearing: a bare `needs:` would ALSO skip on failure, and a
    # skipped required check counts as satisfied, so a red leg would stop blocking the merge. The leg
    # is whichever shape the event ran; the other one skips.
    if: ${{ always() && (needs.gpu.result != 'skipped' || needs.shared.result != 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the GPU leg's result
        env:
          LEG: ${{ needs.shared.result != 'skipped' && needs.shared.result || needs.gpu.result }}
        run: |
          echo "GPU leg: $LEG"
          [ "$LEG" = "success" ] || exit 1

  data-refresh:
    # The result check is explicit: merge skips when an example is red, and the implicit success()
    # would skip this job for it without a word.
    if: ${{ !cancelled() && needs.merge.result == 'success' && github.event_name == 'push' }}
    needs: merge
    uses: ./.github/workflows/data-refresh.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      artifact-name: examples-eval
      src: examples_bench.json
      dest: docs/data/examples_bench.json
    secrets: inherit
