name: cpu-pytest

# The pytest suite on CPU (ubuntu), the per-PR merge gate: every test but the `gpu` tests, which need
# a CUDA device, and the `px4_sitl` tests, which fly a real PX4 SITL; gpu-pytest.yml runs those.
# No path filter so it's a clean required check (a path-filtered required check stays stuck-pending
# on PRs that don't match).
# The tests run on one worker per vCPU, as pyproject.toml sets: the log names the workers and the
# 25 slowest tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Warp's compiled kernels, keyed as in gpu-runner.yml on the versions that shape them: a cold
      # cache makes each worker compile the same kernels before its first build, about 45 s on 4 vCPUs.
      # The key ends in the run's id, so every run saves what it restored plus what it compiled, and the
      # entry grows until it holds every kernel the suite builds; an entry saved once under a fixed key
      # kept only its first run's kernels. A CPU-only entry is a few MB.
      - name: Compute the Warp cache key
        id: warp-key
        run: |
          v() { awk -v n="$1" '$0 == "name = \"" n "\"" { f = 1 } f && /^version = / { gsub(/"/, "", $3); print $3; exit }' uv.lock; }
          echo "versions=warp-$(v warp-lang)-newton-$(v newton)-mujoco-warp-$(v mujoco-warp)" >> "$GITHUB_OUTPUT"
      - name: Restore Warp kernel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/warp
          key: ${{ steps.warp-key.outputs.versions }}-cpu-pytest-${{ github.run_id }}
          restore-keys: |
            ${{ steps.warp-key.outputs.versions }}-cpu-pytest-
            ${{ steps.warp-key.outputs.versions }}-
      - run: uv run --locked --extra policy pytest -m "not gpu and not px4_sitl" --cov=nexus_sim --cov-report=xml --durations=25
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: cpu
          fail_ci_if_error: false
