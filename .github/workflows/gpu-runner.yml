name: gpu-runner

# Reusable GPU-CI lifecycle: spin up an EPHEMERAL AWS-EC2 GPU box (machulav/ec2-github-runner), run a
# caller-supplied command on it, then tear it down — every gpu-* workflow calls this so the start/stop
# plumbing lives in one place, and a caller that fans out calls it once per cell through a matrix, one
# box per cell, since a measured flight shares neither a GPU nor PX4's fixed ports. Ephemeral ⇒ safe
# on any pull request (a fresh disposable box per run). Runs in
# Freefly's AWS account (multi-region — placement discovered per run, see #26); the box boots the
# latest AWS Deep Learning Base GPU AMI
# (NVIDIA drivers + Docker + nvidia-container-toolkit, resolved at runtime); a PX4 run builds the
# px4-sitl image on the box the way a user's first run does, an RTX run pulls NVIDIA's Isaac Sim
# image, and the box restores the one cache entry its caller names. On push, schedule and dispatch
# runs the EC2 instance role lets a command's --upload write public/ci/* in the CI artifacts bucket
# and read the bench feed at public/ci/bench/*, which it merges into, through the instance profile.
# The read needs s3:ListBucket on that prefix too, else S3 answers a missing key with 403, not 404.
# A same-repo PR run launches with the caller's read-only instance
# profile when it names one, else with none; a fork's PR run always launches with none. No PR run
# carries a Cesium token, since nothing a PR run does needs it. The bucket's public/* prefix is SERVED
# THROUGH CLOUDFRONT (docs .rrd embeds + the bench feed), so treat everything uploaded there as
# public. A CI output that is not published rides a GitHub artifact.
#
# Provisioning (one-time): secrets AWS_GPU_INSTANCE_PROFILE, the instance profile a main-push run
# attaches so its uploads need no keys, NEXUS_BUCKET, the artifacts bucket those uploads write to,
# AWS_RUNNER_RESOURCE_TAG where tagged subnets opt in, and AWS_GPU_ROLE_ARN (OIDC). Optional:
# AWS_GPU_PR_INSTANCE_PROFILE, the instance profile a same-repo PR run attaches, for a caller whose
# flights read a private S3 prefix. Its role must grant reads alone, and AWS_GPU_ROLE_ARN's role needs
# iam:PassRole on it, an act of the AWS account's admin. They name
# resources in an AWS account, so they are secrets and the runner masks them in the public logs.
# The OIDC role grants ec2:CreateTags on RunInstances, since every box is tagged at launch. The
# runner watchdog stack in scripts/ci/aws/ terminates a tagged box that outlives its run.
# Var CI_APP_CLIENT_ID and secret CI_APP_PRIVATE_KEY, the GitHub App (repo permissions
# Administration, Contents and Pull requests, each read and write) whose per-job tokens register
# the self-hosted runner; var AWS_REGION_CANDIDATES (placement preference order — us-west-2 leads,
# colocated with the consolidated bucket; no static subnets, discovery finds default-VPC subnets per region.
# A region added here, or to the fallback list below, must also go into the watchdog stack's
# MonitoredRegions, see scripts/ci/aws/, or the watchdog never sees a box leaked there);
# the environment external-pr-approval with required reviewers, the per-run approval of the fork
# path. Callers in this repo pass `secrets: inherit`.
#
# A caller under another owner: `secrets: inherit` passes nothing across owners, so it passes each
# secret declared below by name, and those it lacks stay empty. Its own settings, not lines here: the
# AWS role's trust admits the caller's OIDC subject, and the GitHub App is installed on the caller,
# where the runner registers, and on each repo named in read-repositories. The placement script
# comes from this file's own repo and commit, so the caller needs no copy of it.

on:
  workflow_call:
    inputs:
      command:
        description: "Shell command to run on the GPU box (does the work + any --upload)"
        required: true
        type: string
      ref:
        description: "Git ref to check out"
        type: string
        default: ""
      instance-type:
        type: string
        default: g5.2xlarge # 1× A10G, 8 vCPU — the validated type; bump to a larger
        # g5/g6e for heavy isaac-lab training (768 vCPU on-demand G/VT quota available in-region).
      artifact-name:
        type: string
        default: ""
      artifact-path:
        type: string
        default: ""
      coverage-flags:
        description: "If set, upload ./coverage.xml to Codecov under this flag (the command must emit it)"
        type: string
        default: ""
      fetch-depth:
        description: "Checkout fetch depth (0 = full history, for base-vs-head comparisons)"
        type: number
        default: 1
      cache-path:
        description: "One cache entry to restore and save on the box: its paths, one per line (empty: none)"
        type: string
        default: ""
      cache-name:
        description: "That entry's name: the leading part of its key, and the prefix a miss restores the newest entry from"
        type: string
        default: ""
      cache-files:
        description: "The tracked files whose content keys that entry: git pathspecs, one per line; a change to any starts a new entry"
        type: string
        default: ""
      cache-drop:
        description: "Paths inside the entry to remove before it is saved, for what a run writes there that the next run must not read"
        type: string
        default: ""
      cache-scope:
        description: "The name of this call's kernel-cache entry: a matrix passes its cell, and calls that share a scope share an entry"
        type: string
        default: ""
      read-repositories:
        description: "Repos under the caller's owner (comma-separated) the command reads with $REPO_READ_TOKEN"
        type: string
        default: ""
    secrets:
      AWS_GPU_ROLE_ARN: { required: false }
      AWS_GPU_INSTANCE_PROFILE: { required: false }
      AWS_GPU_PR_INSTANCE_PROFILE: { required: false }
      AWS_RUNNER_RESOURCE_TAG: { required: false }
      NEXUS_BUCKET: { required: false }
      CI_APP_PRIVATE_KEY: { required: false }
      CESIUM_ION_TOKEN: { required: false }
      CODECOV_TOKEN: { required: false }

env:
  AWS_REGION: eu-central-1 # the OIDC/STS session entry region only — instance placement is discovered

jobs:
  # The fork path's approval: a labeled fork PR's pull_request_target run waits here for a
  # maintainer's per-run approval on the external-pr-approval environment (required reviewers).
  # The label opens the path, the approval is the spend act, once per run — a later push waits
  # for its own. Every other event skips this job. It lives here, not in the callers, because a
  # job with `uses:` cannot carry an environment.
  approve-fork:
    if: >-
      ${{ github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.fork == true &&
          contains(github.event.pull_request.labels.*.name, 'gpu') }}
    runs-on: ubuntu-latest
    environment: external-pr-approval
    permissions: {}
    steps:
      - run: echo "approved ${{ github.event.pull_request.head.sha }}"

  start-runner:
    # THE GPU-spend gate, enforced once here rather than by each caller: an allowlist of the
    # events that may start the paid instance. workflow_dispatch: a maintainer's act. push and
    # schedule: main and the cron. pull_request: same-repo branches carrying the `gpu` label, which
    # is the spend approval. pull_request_target: fork PRs whose labeled run approve-fork approved.
    # Anything else — a same-repo pull_request_target, a fork pull_request — starts nothing. It
    # belongs with the job that starts the paid instance — a caller cannot forget it, and changing
    # the policy is one edit.
    needs: approve-fork
    # !cancelled() is load-bearing: the implicit success() would skip this job whenever
    # approve-fork skipped, which is every event but the fork path.
    if: >-
      ${{ !cancelled() && (
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' || github.event_name == 'schedule' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.fork == false &&
           contains(github.event.pull_request.labels.*.name, 'gpu')) ||
          (github.event_name == 'pull_request_target' && needs.approve-fork.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read } # OIDC — no static AWS keys
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
      region: ${{ steps.start.outputs.region }}
    steps:
      # This file's own repo and commit, not the caller's: only the discovery script is needed, and a
      # caller under another owner has no copy of it. No pushes.
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GPU_ROLE_ARN }}
      # Capacity via BREADTH, not retries (#26, the upstream newton pattern): discover eligible
      # placements at run time — tagged resources and each candidate region's default VPC (a subnet
      # per AZ, zero provisioning), in AWS_REGION_CANDIDATES order (us-west-2 first — colocated
      # with the consolidated bucket). The action tries entries in order; quota-less regions just
      # fail over (~10 s each).
      - name: Discover runner placements
        id: discover
        env:
          AWS_REGION_CANDIDATES: ${{ vars.AWS_REGION_CANDIDATES || 'us-west-2 eu-central-1 us-east-1 us-east-2' }}
          AWS_INSTANCE_TYPE: ${{ inputs.instance-type }}
          # The opt-in tag key on subnets and security groups, a name in the account and not a line
          # here. Unset: discovery skips the tagged step and places on each region's default VPC.
          AWS_RUNNER_RESOURCE_TAG: ${{ secrets.AWS_RUNNER_RESOURCE_TAG }}
        run: python3 scripts/ci/discover_aws_runner_config.py
      # One App token per job, minted right before its use and revoked when the job ends: it
      # never crosses into `run` or `stop-runner`, which mint their own.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-administration: write # registers the runner (generate-jitconfig)
      - id: start
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ steps.app-token.outputs.token }}
          ec2-instance-type: ${{ inputs.instance-type }}
          availability-zones-config: ${{ steps.discover.outputs.availability-zones-config }}
          # The instance profile (write public/ci/*, read public/ci/bench/*) rides push, schedule and
          # dispatch runs only: nothing a PR run does uploads, and an approved fork's code must not
          # be able to write to the CI artifacts bucket. A same-repo PR run gets the caller's
          # read-only profile instead, or none, and pull_request_target never gets one: the command
          # there is a fork's code. The conditions are negated on purpose — in an Actions
          # expression `cond && '' || 'x'` yields 'x' for both truth values, so an unset profile
          # falls through to the next branch, which must then yield ''.
          iam-role-name: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') && secrets.AWS_GPU_INSTANCE_PROFILE || (github.event_name == 'pull_request' && secrets.AWS_GPU_PR_INSTANCE_PROFILE || '') }}
          # The DL AMI's default root is 35 GB — the OS+CUDA stack alone nearly fills it, and the
          # 21 GB Isaac Sim image pull (benchmark matrix) then kills the runner with disk
          # exhaustion (job dies, logs never upload). 100 GB gp3 costs cents per ephemeral run.
          # At gp3's default 125 MiB/s the disk, not the network, bounds that pull: the download
          # ends in about a minute and the writes sit at the cap for the rest. 1000 MiB/s and
          # 16000 IOPS cut a warm RTX cell's Run step from 8.2 to 4.6 min, one run each, for cents.
          block-device-mappings: >-
            [{"DeviceName": "${{ steps.discover.outputs.root-device }}", "Ebs": {"VolumeSize": 100, "VolumeType": "gp3", "Throughput": 1000, "Iops": 16000, "DeleteOnTermination": true}}]
          pre-runner-script: |
            sudo usermod -aG docker ubuntu || true
            sudo systemctl enable docker || true
            sudo systemctl start docker || true
          # The action sets these on the RunInstances call itself, so a box is tagged from launch,
          # even when a cancel lands before this job publishes the instance id. created-by is the
          # ownership tag the runner watchdog (scripts/ci/aws/) scans for and may terminate.
          aws-resource-tags: >-
            [{"Key": "Name", "Value": "ec2-github-runner"},
             {"Key": "created-by", "Value": "nexus-gpu-ci"},
             {"Key": "GitHub-Repository", "Value": "${{ github.repository }}"},
             {"Key": "GitHub-Run-ID", "Value": "${{ github.run_id }}"},
             {"Key": "GitHub-Run-Attempt", "Value": "${{ github.run_attempt }}"}]

  run:
    needs: start-runner
    # Explicit, because the implicit success() skips a job when any job above it skipped, not only
    # its direct need: approve-fork skips on every event but the fork path, so without this line the
    # box started and stopped with no work done while the callers' contexts reported success.
    if: ${{ !cancelled() && needs.start-runner.result == 'success' }}
    runs-on: ${{ needs.start-runner.outputs.label }} # the ephemeral GPU box
    # Below the runner watchdog's 90-min age limit, so the watchdog never reclaims a box that is
    # still working. The longest green run job was 19 min, a cesium cell of the benchmark matrix.
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      # The box's runner service exports no $HOME; anything running `git config --global`
      # (e.g. the codecov wrapper) dies on it, and ~-paths resolve inconsistently.
      - name: Set HOME
        run: |
          echo "HOME=$(getent passwd "$(id -u)" | cut -d: -f6)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          # The fork path checks out the approved run's frozen head sha: on pull_request_target
          # github.sha is the base branch's head, and the merge ref would move under a later push.
          ref: "${{ inputs.ref || (github.event_name == 'pull_request_target' && github.event.pull_request.head.sha) || github.sha }}"
          # actions/checkout refuses a fork's code on pull_request_target unless the step opts in. The
          # fork path opts in on purpose: a maintainer approves each run on external-pr-approval, and the
          # box gets a read-only token, no instance profile, no Cesium token and no Codecov token.
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          fetch-depth: ${{ inputs.fetch-depth }}
          # Nothing on the box pushes; persisted credentials also leak into every git call as an
          # http.extraheader (the trap that broke px4-bump's tokened ls-remote).
          persist-credentials: false
      # cache-local-path is explicit because the ephemeral runner starts with no $HOME —
      # setup-uv would otherwise compute a literal "undefined/.cache/uv" cache dir.
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-local-path: /tmp/setup-uv-cache }
      # The kernel cache is keyed on the versions that shape the kernels, read from uv.lock, and on
      # the caller's cache-scope. A key is written once and the first saver wins, so boxes saving
      # under one key would keep the first box's kernels only; a scope with no entry yet restores
      # another scope's on the same versions, which shares most kernels, and compiles the
      # difference. A key over every nexus module missed on any Python edit.
      - name: Compute the Warp cache key
        id: warp-key
        run: |
          v() { awk -v n="$1" '$0 == "name = \"" n "\"" { f = 1 } f && /^version = / { gsub(/"/, "", $3); print $3; exit }' uv.lock; }
          echo "versions=warp-$(v warp-lang)-newton-$(v newton)-mujoco-warp-$(v mujoco-warp)" >> "$GITHUB_OUTPUT"
      - name: Restore Warp kernel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/warp
          key: ${{ steps.warp-key.outputs.versions }}-${{ inputs.cache-scope }}
          restore-keys: ${{ steps.warp-key.outputs.versions }}-
      # The caller's one cache entry: this runner knows no component, so the caller names the paths,
      # the entry's name and the tracked files that shape it, and the key hashes those files here: a
      # reusable workflow's `with` cannot call hashFiles, and hashFiles takes one pattern per
      # argument, never a list in one string. The key is the name and that hash alone, so calls that
      # cache the same paths under the same name share one entry and the first saver wins: a PX4 tree
      # of about 2 GB is saved once per pin, not once per box, against the repo's 10 GB budget. A miss
      # restores the newest entry under the name, so a bump builds incrementally over the last tree and
      # a render cell boots on another cell's shaders. Actions cannot loop steps, so a caller with two
      # things to cache lists both paths under one entry.
      - name: Compute the cache entry's key
        if: inputs.cache-path != ''
        id: cache-key
        env:
          FILES: ${{ inputs.cache-files }}
        # set -f: a pathspec's * is git's to expand, across folders, not the shell's. A pathspec that
        # matches no tracked file fails the step: the key would silently stop following that file.
        run: |
          set -f
          for spec in $FILES; do
            if [ -z "$(git ls-files -- "$spec")" ]; then
              echo "::error::cache-files: $spec matches no tracked file"
              exit 1
            fi
          done
          # shellcheck disable=SC2086 # one pathspec per line, split on purpose
          hash=$(git ls-files -z -- $FILES | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore the caller's cache entry
        if: inputs.cache-path != ''
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-name }}-${{ steps.cache-key.outputs.hash }}
          restore-keys: ${{ inputs.cache-name }}-
      - name: Fail early when a main-push run has no instance profile
        # Only push, schedule and dispatch attach one, and only they upload; a PR run passes an empty
        # name on purpose. A step's `if:` cannot read a secret, so the check reads it from env.
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        env:
          AWS_GPU_INSTANCE_PROFILE: ${{ secrets.AWS_GPU_INSTANCE_PROFILE }}
        run: |
          if [ -z "$AWS_GPU_INSTANCE_PROFILE" ]; then
            echo "::error::set the repo secret AWS_GPU_INSTANCE_PROFILE: this run uploads and needs an instance profile"
            exit 1
          fi
      # A read-only token for the repos the command clones, minted right before its use. Never on
      # pull_request_target: the command there is a fork's code.
      - id: read-token
        if: inputs.read-repositories != '' && github.event_name != 'pull_request_target'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.read-repositories }}
          permission-contents: read
      - name: Run
        env:
          REPO_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          # Only the benchmark matrix's cesium cells read it, on schedule and dispatch: PR runs of
          # either event get an empty value (negated on purpose, see iam-role-name), as does any
          # repo without the secret — cesium cells then skip.
          CESIUM_ION_TOKEN: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') && secrets.CESIUM_ION_TOKEN || '' }}
          # The artifacts bucket an --upload run writes to: a name in the account, so a setting.
          NEXUS_BUCKET: ${{ secrets.NEXUS_BUCKET }}
          # The one profile a PR run may carry: the caller's read-only one, on pull_request alone.
          PR_INSTANCE_PROFILE: ${{ github.event_name == 'pull_request' && secrets.AWS_GPU_PR_INSTANCE_PROFILE || '' }}
        # A PR run, same-repo or fork, must reach the command with no Cesium token, and with no
        # instance profile on the box but the caller's read-only one on a same-repo run. The guard
        # fails the run otherwise, so a change that brings the push profile to a PR run, or any
        # profile to a fork's, is caught on its first PR run. IMDS answers 404 for iam/info when no
        # profile is attached, and 200 with the profile's InstanceProfileArn when one is.
        run: |
          case "$GITHUB_EVENT_NAME" in pull_request|pull_request_target)
            imds=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60" || true)
            iam=$(curl -s -o "$RUNNER_TEMP/iam-info" -w '%{http_code}' -H "X-aws-ec2-metadata-token: $imds" http://169.254.169.254/latest/meta-data/iam/info || true)
            profile=$(sed -n 's/.*"InstanceProfileArn" *: *"[^"]*\/\([^"/]*\)".*/\1/p' "$RUNNER_TEMP/iam-info" 2>/dev/null || true)
            echo "PR run: iam/info returned $iam, profile '$profile', CESIUM_ION_TOKEN length ${#CESIUM_ION_TOKEN}"
            if [ -n "$PR_INSTANCE_PROFILE" ]; then
              [ "$iam" = 200 ] && [ "$profile" = "$PR_INSTANCE_PROFILE" ] && ok=1 || ok=
            else
              [ "$iam" = 404 ] && ok=1 || ok=
            fi
            if [ -z "$ok" ] || [ -n "$CESIUM_ION_TOKEN" ]; then
              echo "::error::a PR run must carry no Cesium token, and no instance profile but the caller's read-only one on a same-repo run"
              exit 1
            fi ;;
          esac
          ${{ inputs.command }}
      # What the caller's entry must not carry: actions/cache archives the whole folder, an exclusion
      # pattern removes nothing inside it, so the caller's cache-drop paths go before the post step
      # saves the entry. always(): a red run still saves what it built. Bash expands no `~` that a
      # variable holds, so a leading one becomes $HOME here before the glob expands.
      - name: Drop what the cache entry must not carry
        if: ${{ always() && inputs.cache-drop != '' }}
        env:
          DROP: ${{ inputs.cache-drop }}
        run: |
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            p="${p/#\~/$HOME}"
            # shellcheck disable=SC2086 # a path is a glob, so it expands unquoted
            rm -rf $p
          done <<< "$DROP"
      - name: Upload coverage to Codecov
        if: ${{ inputs.coverage-flags != '' }}
        uses: codecov/codecov-action@v5
        with:
          # The fork path's code ran earlier in this job on the same box and could rewrite this
          # action before it starts, so the token stays off pull_request_target runs; their upload
          # fails soft (fail_ci_if_error: false). Other runs keep it: Codecov takes an upload with
          # no token only from a fork's branch.
          token: ${{ github.event_name != 'pull_request_target' && secrets.CODECOV_TOKEN || '' }}
          files: ./coverage.xml
          flags: ${{ inputs.coverage-flags }}
          fail_ci_if_error: false
      - name: Upload artifacts
        if: ${{ always() && inputs.artifact-name != '' }}
        uses: actions/upload-artifact@v4
        # include-hidden-files: upload-artifact >= 4.4 silently drops dot-paths by default, and the
        # examples harness writes to the gitignored dot-dir .eval-artifacts.
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          include-hidden-files: true

  stop-runner:
    needs: [start-runner, run]
    runs-on: ubuntu-latest
    # Tear the box down whenever start-runner ran: failed or cancelled, it may have launched one.
    # Only a spend-gate skip starts nothing. Each step needs the instance id, since the stop fails
    # without it with "The 'ec2-instance-id' input is required for the 'stop' mode", burying the
    # real reason. The action publishes the id right after RunInstances, so a cancel while the box
    # boots still leaves the id here. The runner watchdog in scripts/ci/aws/ reclaims a box by its
    # tags when no id was published or this job did not stop it.
    if: ${{ always() && needs.start-runner.result != 'skipped' }}
    permissions: { id-token: write, contents: read }
    steps:
      - if: ${{ needs.start-runner.outputs.ec2-instance-id != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The instance may have launched in any discovered region — stop it where it lives.
          aws-region: ${{ needs.start-runner.outputs.region || env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GPU_ROLE_ARN }}
      - id: app-token
        if: ${{ needs.start-runner.outputs.ec2-instance-id != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-administration: write # removes the runner registration
      - if: ${{ needs.start-runner.outputs.ec2-instance-id != '' }}
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ steps.app-token.outputs.token }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
