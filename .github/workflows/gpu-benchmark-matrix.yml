name: gpu-benchmark-matrix

# The RTF benchmark matrix (scripts/ci/benchmark_matrix.py): ONE PX4 4-waypoint mission across
# {vehicle × scene × device} on the pinned A10G runner — the physics table plus the RTX table, whose
# camera renders in the Kit peer the cell starts; an RTX cell pulls NVIDIA's Isaac Sim image on its box, as a
# user's first RTX run does, and restores the peer's caches from the last run, so Kit boots warm.
# Cesium cells need the CESIUM_ION_TOKEN secret and are skipped without it. One box per cell: a
# measured flight cannot share a GPU, the RTF being the whole deliverable, nor PX4's fixed ports,
# so `plan` lists the cells, `cell` flies each on a box of its own through gpu-runner.yml, and
# `merge` joins their results over the committed matrix. Scheduled + dispatch only, NOT per-push:
# the RTX cells cost minutes each. Ends with a data-refresh PR updating docs/data/rtf_matrix.json —
# the docs Benchmarking page changes only through that reviewed diff.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "physics | rtx (empty = the full matrix)"
        type: string
        default: ""

permissions:
  id-token: write # OIDC — gpu-runner assumes the AWS role to start/stop the box
  contents: read

concurrency:
  group: gpu-benchmark-matrix
  cancel-in-progress: false

jobs:
  # The cells to fly, and the cesium cells skipped without the token, as one JSON for the matrix
  # below and for merge's _meta. No GPU: the listing is a lookup.
  plan:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: plan
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          ONLY: ${{ inputs.only }}
        # The assignment carries the listing's exit status, so a rejected `only` or a broken script
        # reds this job with its message, rather than handing the matrix an empty plan.
        run: |
          plan=$(python3 scripts/ci/benchmark_matrix.py --list ${ONLY:+--only "$ONLY"})
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  # The GPU-spend gate lives in gpu-runner.yml, once, on the job that starts the instance.
  # fail-fast is off so one red cell never cancels the others' numbers.
  cell:
    name: ${{ matrix.cell.tag }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.plan).cells }}
    uses: ./.github/workflows/gpu-runner.yml
    with:
      # The cell's one cache entry: the PX4 tree and image, and for an RTX cell the Kit peer's caches
      # too, its shader cache and the home Kit writes its user caches into, so Kit boots warm on its
      # fresh box; the shader cache is keyed by shader content, so another cell's entry still saves
      # most compiles. Cesium's request cache holds the tiles a cesium cell streamed, and a restored
      # one would feed the next cell from disk, so its RTF no longer measures a network stream: it
      # goes before the entry is saved.
      cache-path: |
        ~/.cache/nexus/px4
        ~/.cache/nexus/ci/px4-sitl.tar
        ${{ matrix.cell.renders && '~/.cache/nexus/kit' || '' }}
      cache-name: ${{ matrix.cell.renders && 'px4-kit' || 'px4' }}
      cache-files: >-
        ${{ format('nexus/_src/vehicle/controllers/px4/px4.ref, nexus/_src/vehicle/controllers/px4/checkout.py, nexus/_src/vehicle/controllers/px4/px4-sitl/Dockerfile{0}', matrix.cell.renders && ', nexus/_src/rendering/kit-peer/**' || '') }}
      cache-drop: ${{ matrix.cell.renders && '~/.cache/nexus/kit/home/.cache/ov/cesium-request-cache.sqlite*' || '' }}
      cache-scope: ${{ matrix.cell.tag }}
      command: >-
        bash scripts/ci/px4_image_cache.sh load &&
        uv run python scripts/ci/benchmark_matrix.py --cell ${{ matrix.cell.tag }} --work .eval-artifacts/matrix &&
        bash scripts/ci/px4_image_cache.sh save
      artifact-name: benchmark-cell-${{ matrix.cell.tag }}
      artifact-path: .eval-artifacts
    secrets: inherit

  # The cell results join over the committed matrix into the one benchmark-matrix artifact the
  # data-refresh PR reads. A red cell skips this, so a partial matrix never becomes a data PR; the
  # cells' own artifacts keep what did fly. No GPU.
  merge:
    needs: [plan, cell]
    if: ${{ !cancelled() && needs.cell.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-cell-*
          path: .eval-artifacts
          merge-multiple: true
      - env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: >-
          python3 scripts/ci/benchmark_matrix.py --merge --plan "$PLAN"
          --work .eval-artifacts/matrix --out .eval-artifacts/matrix/rtf_matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-matrix
          path: .eval-artifacts
          include-hidden-files: true

  data-refresh:
    needs: merge
    # The result check is explicit: merge skips when a cell is red, and the implicit success()
    # would skip this job for it without a word.
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    uses: ./.github/workflows/data-refresh.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      artifact-name: benchmark-matrix
      src: matrix/rtf_matrix.json
      dest: docs/data/rtf_matrix.json
    secrets: inherit
