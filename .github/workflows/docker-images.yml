name: docker-images

# Build + push the px4-sitl image to GHCR so the gpu-* jobs (and the decoupled SITL workflow) pull
# it instead of anyone building by hand. `${{ github.repository }}` resolves the path to
# ghcr.io/<this repository>/<name>, the prefix nexus/_src/containers.py names.
#
# Notes:
# - The Kit image is NOT built here: it holds NVIDIA's layers, so it can't be a public package,
#   and each machine builds it from nexus/_src/rendering/kit-peer/ on its first RTX run.
# - After the first push, set the GHCR package to **Public** (package settings) so the ephemeral CI
#   runner can `docker pull` without auth. (GHCR packages are private by default; visibility is
#   independent of repo visibility.)

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: px4-sitl, context: docker/px4-sitl }
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
