# catalog.yaml — the checked-in vehicle/scene catalog.
#
# S3 holds only content-addressed blobs; this file is the semantic <-> content binding. Every
# vehicle variant is a name, its key, plus its USD, which declares its controller. A launch names the variant it flies,
# `--vehicle astro_max_fpv`, and the scene it flies in, `--scene empty`. The name is what the run's
# receipt records.
#
# Assets are referenced by `{name, sha256}`, completed against `assets.base` below into a
# self-contained `.usdz` at <base>/assets/usd/{vehicles,scenes}/<name>-<sha256>.usdz; see
# nexus_uav/_src/assets/resolver.py, which also places an example's hosted policy at
# <base>/assets/policies/<name>-<sha256>.pt. An entry may carry a full `url` instead, which is how a catalog
# names a blob hosted somewhere else, or a local file. Each USD declares
# its rotors, a `NexusPropellerAPI` propeller on each rotor body beside the `NewtonActuator` motor on its
# joint, AND — for the FPV mods — an authored FpvCam the Kit render peer renders.
#
# Each vehicle USD declares PX4 with `NexusPx4API` on its controller's scope, the Scope
# /astro_max/Controller, and its `nexus:airframe` is the
# SITL airframe make target minus PX4's `none_` prefix: `astro_max` runs `make px4_sitl
# none_astro_max`. Both vehicles fly `astro_max` until payload mass is modeled. Beside it, `NexusPx4SitlAPI`
# declares the PX4 SITL peer, which the run starts; a run's override layer drops it to fly an
# autopilot started elsewhere.

# Where this catalog's blobs live. A project with its own catalog names its own base here.
assets:
  base: https://d2837jz4fvtxko.cloudfront.net/public

vehicles:
  astro_max_base:
    usd: { name: astro_max_base, sha256: b51d1612159f1f97582d4c37724f600adc3263082526d5fb56a7f23b3a86ee05 }

  astro_max_fpv:
    usd: { name: astro_max_fpv, sha256: 028773800f39e58aea09ef24fc488474b7e5f4a7ed1ce56e7b55825c6e52a524 }

# The scene USD is the single authority on what it is: authored UsdPhysics collision schemas ->
# simulation geometry (ModelBuilder); no physics schemas -> visual-only; and since the stage-5
# round every scene usdz also carries its own SKY (dome+sun) and — where it needs one — its stage
# render recipe (customLayerData.renderSettings, auto-applied when the renderer opens the scene as
# the root stage). Its PhysicsScene prim authors where it sits on Earth, nexus:geodeticOrigin on
# NexusSceneAPI, and an override layer moves it. Conventions: ONE root prim (defaultPrim, plain
# Xform, no root xformOps) so the runtime places `start` with a single session-layer translate;
# cesium is exempt (georef-anchored, absolute /Cesium* paths). See scripts/assets/scene_root.py.
scenes:
  empty:                              # flat ground; sky-only usdz, no static geometry
    usd: { name: empty, sha256: 6048870409ba031040676d24e56e152ae6c205807e4c1880e8b84b67e98b5947 }

  slalom:                             # three obstacle pillars for the sampling-MPC demo; the USD authors
                                      # physics:collisionEnabled=false -> cost-only (no contact dynamics)
    usd: { name: slalom, sha256: e5f73b8cbefc8a83c915966abe6d2c6e367292426b6c9e1fc194522750727cbd }

  powerline:                          # an overhead power line on wooden poles beside a road at sunset,
                                      # up a 3 m drop, among firs and boulders: Poly Haven CC0 assets,
                                      # authored by scripts/assets/author_powerline_scene.py. The start
                                      # is on the road beside the line's end pole, where the inspection
                                      # flight of the benchmark matrix takes off.
    usd: { name: powerline, sha256: bbca409406f2137e92d71979b6488d517301d45b0bc71dd0b0bf01c0aa2f1353 }
    start: [14.5, 24.0, 0.06]

  cesium:                             # live-streamed globe visual world (Google Photorealistic 3D
                                      # Tiles via Cesium for Omniverse). The USD ships the tileset.
                                      # Renders only for a camera vehicle; needs CESIUM_ION_TOKEN.
    usd: { name: cesium, sha256: 5857b127ae2517960a985848ae678e72ead3c9eba114fdbf8fa0698ed9809265 }
