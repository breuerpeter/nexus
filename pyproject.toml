[build-system]
requires = ["uv_build>=0.11.0,<1"]
build-backend = "uv_build"

[project]
name = "nexus-sim"
version = "0.2.0"
description = "GPU-accelerated drone simulation"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
authors = [{ name = "Peter Breuer" }]
keywords = [
    "drone", "uav", "simulation", "robotics", "physics",
    "px4", "sitl", "mavlink", "newton", "reinforcement-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "newton[sim]==1.3.0",
    "warp-lang>=1.14.0",
    "numpy",
    "pyyaml>=6.0.2",
    "pydantic>=2.0.0",
    "pymavlink>=2.4.49",
    "usd-core>=25.5,<26.5",
    "newton-usd-schemas>=0.3.1",
    "trimesh>=4.6.8",
    "scipy>=1.11.0",
    "rerun-sdk>=0.34.1,<0.35",
    # The docker daemon client: the framework starts the PX4 SITL container it flies against and
    # the Kit render peer (nexus/_src/containers.py). Pure Python over requests/urllib3, which
    # are already in the tree.
    "docker>=7.1.0",
]

[project.optional-dependencies]
policy   = ["torch"]
examples = ["ruckig>=0.14"]  # jerk-limited reference trajectory the MPC examples track
acados   = ["casadi>=3.6", "ruckig>=0.14", "acados_template"]  # waypoint_tracking.py: NMPC codegen
# Isaac Lab RL training is NOT an extra of the core — it lives in the separate `nexus-rl` uv
# project (own venv), so the heavy, prerelease-pinned Isaac Lab stack stays out of this environment.
all      = ["nexus-sim[policy,examples]"]

[project.scripts]
nexus = "nexus._src.cli.main:main"

[project.urls]
Homepage = "https://github.com/breuerpeter/nexus"
Documentation = "https://breuerpeter.github.io/nexus/"
Repository = "https://github.com/breuerpeter/nexus"
Issues = "https://github.com/breuerpeter/nexus/issues"
Changelog = "https://github.com/breuerpeter/nexus/blob/main/CHANGELOG.md"

[tool.uv]
# The framework is Linux-x86_64 only in practice (CUDA GPU, PX4 SITL, the Kit render peer), so restrict the
# universal lock to that environment to keep resolution deterministic. (The Isaac Lab newton/warp pin
# overrides + prerelease + index-strategy moved to nexus-rl, which is the only consumer of isaaclab.)
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# ruckig ships sdist-only (no wheels since 0.9.2) and its pyproject still uses the pre-0.10
# `cmake.targets` key, which scikit-build-core >= 0.10 rejects as an error — every fresh install
# fails to build it. Pin the build backend until upstream releases a fixed pyproject.
build-constraint-dependencies = ["scikit-build-core<0.10"]

[tool.uv.build-backend]
module-name = "nexus"
module-root = ""

[tool.uv.sources]
warp-lang = { index = "nvidia" }
# acados_template is NOT on PyPI — acados ships its Python interface only inside the C source tree,
# version-locked to the libacados.so you compile. So it's an editable path source: scripts/setup_acados.sh
# builds the C library + this interface into the repo-relative .acados/ (gitignored), then
# `uv sync --extra acados` installs it like any other dep — no imperative `pip install`. The path must
# exist before syncing the acados extra (run setup_acados.sh first); it's optional, so the base sync is
# unaffected.
acados_template = { path = ".acados/interfaces/acados_template", editable = true }

# Declare acados_template's metadata statically so uv can lock it WITHOUT building it from the path — the
# path (.acados/, built by scripts/setup_acados.sh) only has to exist when the `acados` extra is actually
# installed, so the base `uv sync` works on a fresh checkout that hasn't provisioned acados.
[[tool.uv.dependency-metadata]]
name = "acados-template"
version = "0.5.1"
requires-dist = ["numpy", "scipy", "casadi", "matplotlib", "cython", "Deprecated"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true  # only the warp-lang source references it (isaaclab's transitive deps are gone)

[dependency-groups]
# CI evaluation harness only (scripts/ci/evaluate_examples.py): evo is GPLv3 + heavy (matplotlib,
# pandas), so it must NEVER become a [project] dependency — examples dump plain numpy/JSON and the
# harness alone imports evo to score them.
ci = ["evo>=1.36"]
docs = [
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-material[imaging]>=9.7.6",  # [imaging] = pillow + cairosvg for the social-card plugin
    "pillow>=10.0",
    "brotli>=1.1",
    "mkdocstrings[python]>=0.27",  # API reference auto-generated from Google-style docstrings (griffe, static)
    "ruff",  # lets mkdocstrings format rendered signatures (separate_signature)
]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]
[tool.ruff.lint]
select = ["E","I","F","W","B","C4","NPY","PLC","PLE","PLW","UP","RUF","D"]
# D1xx (missing-docstring) rules are off for now so undocumented code still passes;
# docstrings that *do* exist must follow the Google convention. Drop these to require
# docstrings everywhere once coverage is in place.
# D205/D415 are deferred: the existing corpus has multi-line summaries / no terminal
# punctuation. TODO: migrate existing docstrings to one-line summaries, then re-enable.
ignore = ["E501","PLC0415","RUF001","RUF002","RUF003","PLW0603",
          "D100","D101","D102","D103","D104","D105","D106","D107",
          "D205","D415"]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.format]
quote-style = "double"
